[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "racing-core"
version = "0.1.0"
description = "Per-step physics of racing-rl, car, lidar and track queries."
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26"]

[tool.maturin]
module-name = "racing_core"

# Rebuild when the Rust sources change, uv would reuse the old build otherwise.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]
