# Experiment on exp/lookahead. mvp_curriculum_4m.yaml plus an overspeed penalty, see allowed_speed in
# learning/reward.py. Training seed 2 of mvp_curriculum_4m never braked before corners.
total_timesteps: 4000000
n_envs: 8
difficulty: 0.0
curriculum:
  step: 0.25
  threshold: 0.7
checkpoint_freq: 250000
eval:
  freq: 100000
  tracks: 20  # validation track seeds 1000 to 1019
reward:
  progress: 10.0
  time: 0.01
  jitter: 0.01
  grass: 0.05
  idle: 0.0
  crawl: 0.03
  overspeed: 0.2
  off_road: 5.0
  stuck: 10.0
  lap: 5.0
ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.0
  policy_kwargs:
    net_arch: [64, 64]
