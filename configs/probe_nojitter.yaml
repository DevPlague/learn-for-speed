# Probe with no steering jitter penalty, to test the standing still optimum.
total_timesteps: 200000
n_envs: 10
difficulty: 0.0
checkpoint_freq: 100000
eval:
  freq: 50000
  tracks: 20  # validation seeds 1000 to 1019
reward:
  progress: 10.0
  time: 0.01
  jitter: 0.0
  grass: 0.05
  off_road: 5.0
  lap: 5.0
ppo:
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 512
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  ent_coef: 0.0
  policy_kwargs:
    net_arch: [64, 64]
