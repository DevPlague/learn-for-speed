[project]
name = "racing-rl"
version = "0.1.0"
description = "PPO agent that learns to drive procedurally generated 2D racing circuits."
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.4,<3",
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.11",
    "pygame>=2.5",
    "tensorboard>=2.15",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    "matplotlib>=3.8",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.uv]
# Dependencies only: you decide the package layout. Add a [build-system] later if you
# want the code installable; until then run scripts from the repo root.
package = false

# CPU-only PyTorch: PPO with a small MLP is CPU-bound, and the default Linux wheel drags in
# ~3 GB of CUDA libraries we never use.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
